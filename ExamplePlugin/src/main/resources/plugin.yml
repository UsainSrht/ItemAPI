name: ItemAPIExamplePlugin
version: '1.0.0-SNAPSHOT'
main: me.usainsrht.itemapi.example.ItemAPIExamplePlugin
api-version: '26.2'
authors: [UsainSRHT]
description: Example plugin for testing ItemAPI features
commands:
  itemapi:
    description: Get YAML items, reload config, or test item sprites
    usage: /itemapi <yamlitemkey|reload|testsprite>
    permission: itemapi.example
permissions:
  itemapi.example:
    description: Use /itemapi commands
    default: op
